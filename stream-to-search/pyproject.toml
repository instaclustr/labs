[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "instaclustr-sdk"
version = "0.1.0"
description = "A seamless streaming-to-search SDK: publish events to Kafka, detect anomalies in ClickHouse — synchronously (demo) or asynchronously (production)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "confluent-kafka>=2.3",
    "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
# pytest, plus the OpenAI SDK so the cross-provider agent test always runs.
dev = ["pytest>=7", "pydantic-ai-slim[openai]>=2.42,<3"]
# AI agent + RAG. pydantic-ai (with its Anthropic extra, for the default model) drives the model
# calls in instaclustr_sdk.agent; voyageai is an optional (better) embedder for
# instaclustr_sdk.rag — it falls back to a local embedder without it.
ai = ["pydantic-ai-slim[anthropic]>=2.42,<3", "voyageai>=0.3"]
# Other model providers for the agent, installed alongside [ai], e.g. ".[ai,openai]". [openai]
# also covers OpenAI-compatible servers such as Ollama; any other provider Pydantic AI supports
# installs as pydantic-ai-slim[<provider>]. Pick the model with INSTACLUSTR_SDK_AGENT_MODEL.
openai = ["pydantic-ai-slim[openai]>=2.42,<3"]
google = ["pydantic-ai-slim[google]>=2.42,<3"]

[tool.setuptools.packages.find]
include = ["instaclustr_sdk*"]
