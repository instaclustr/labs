# Loads every dashboard JSON under /var/lib/grafana/dashboards on startup.
apiVersion: 1

providers:
  - name: stream-to-search
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
